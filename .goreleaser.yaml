version: 2

project_name: kongctl

before:
  hooks:
    - go mod tidy

builds:
  - id: kongctl
    main: ./cmd/kongctl
    binary: kongctl
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/m0un10/kongctl/internal/cli.Version={{.Version}}
      - -X github.com/m0un10/kongctl/internal/cli.Commit={{.ShortCommit}}
      - -X github.com/m0un10/kongctl/internal/cli.Date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files: [plugin.yaml, README.md, kongctl.example.yaml, NOTICE]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\(.+\))?!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

# The CMP image: prebuilt binaries on scratch, multi-arch, tagged with the
# version, major.minor, major and latest. Built and pushed in the publish
# phase; `make snapshot` skips it.
dockers_v2:
  - id: kongctl
    dockerfile: Dockerfile.goreleaser
    images:
      - ghcr.io/m0un10/kongctl
    tags:
      - "{{ .Version }}"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: https://github.com/m0un10/kongctl
      org.opencontainers.image.description: Compose, check and deliver Kong declarative config; Argo CD CMP
    extra_files: [plugin.yaml]

release:
  github:
    owner: m0un10
    name: kongctl
  draft: false
  prerelease: auto
  make_latest: true
  name_template: "{{ .Tag }}"
  footer: |
    ## Install

    Binaries for linux and darwin (amd64, arm64) are attached; verify with
    `checksums.txt`. The Argo CD CMP image is
    `ghcr.io/m0un10/kongctl:{{ .Version }}` (also `{{ .Major }}.{{ .Minor }}`,
    `{{ .Major }}` and `latest`).
