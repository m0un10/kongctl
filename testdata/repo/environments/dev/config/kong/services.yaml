_format_version: "3.0"
services:
- connect_timeout: 60000
  enabled: true
  host: upstream.dev.example.internal
  name: orders-service
  path: /
  plugins:
  - config:
      hide_credentials: false
      key_in_query: true
      key_names:
      - apikey
    enabled: true
    name: key-auth
  - config:
      replace:
        uri: /orders$(uri_captures[1])
    enabled: true
    name: request-transformer
  port: 443
  protocol: https
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    name: orders-route
    path_handling: v0
    paths:
    - ~/customer/orders(?<upstream_path>/api(?:/.*)?)$
    preserve_host: false
    protocols:
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: false
  write_timeout: 60000
