# Release on a semver tag. Cutting a release is:
#
#   git tag -a v1.2.3 -m "v1.2.3" && git push origin v1.2.3
#
# or `make release VERSION=v1.2.3`. GoReleaser builds the binaries, writes the
# GitHub Release (marked latest), and pushes the CMP image to GHCR.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The dependency tree (go-database-reconciler, vacuum) is large and
      # GoReleaser compiles every GOOS/GOARCH separately, which exhausted the
      # 14 GB a hosted runner leaves free. Drop the preinstalled toolchains
      # we do not use (about 25 GB) and build two targets at a time.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY/Ruby" "$AGENT_TOOLSDIRECTORY/PyPy"
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --parallelism 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
